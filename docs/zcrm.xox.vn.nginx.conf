# =============================================================================
# Nginx Configuration cho ZCRM — zcrm.xox.vn
# =============================================================================
# Đường dẫn cài đặt khuyên dùng: /etc/nginx/sites-available/zcrm.xox.vn
# Sau đó kích hoạt: sudo ln -s /etc/nginx/sites-available/zcrm.xox.vn /etc/nginx/sites-enabled/
# Xin SSL tự động:  sudo certbot --nginx -d zcrm.xox.vn
# =============================================================================

server {
    listen 80;
    server_name zcrm.xox.vn;

    # Dung lượng upload tối đa cho hình ảnh, video, tài liệu đính kèm
    client_max_body_size 100M;

    # File log truy cập & lỗi
    access_log /var/log/nginx/zcrm_access.log;
    error_log /var/log/nginx/zcrm_error.log;

    # Trỏ Reverse Proxy về ZCRM App Docker Container (Mặc định Port 3080)
    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;

        # Hỗ trợ kết nối WebSocket Real-time (Socket.IO chat)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward các header định danh của Client
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Thời gian chờ cho kết nối WebSocket lâu dài
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
